name: Build and deploy frontend to GitHub Pages

on:
  push:
    branches:
      - feature/cambios-v2
      - main

# Grant the workflow permissions required to create and push pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install front-end dependencies
        working-directory: frontend
        run: npm ci

      - name: Build front-end (relative assets)
        working-directory: frontend
        run: npm run build -- --base ./

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          # Use a personal access token stored as a repository secret named DEPLOY_TOKEN
          # Create one at https://github.com/settings/tokens with at least 'repo' scope
          # and add it in the repository Settings -> Secrets -> Actions as DEPLOY_TOKEN.
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          publish_dir: ./frontend/dist
